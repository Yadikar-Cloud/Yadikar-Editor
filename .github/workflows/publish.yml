name: 'publish'

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Stage MSIX content
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force msix-staging | Out-Null
          Copy-Item src-tauri/target/release/yadikar-editor.exe msix-staging/
          # copy any resources/DLLs your app needs next to the exe, for example:
          # Copy-Item src-tauri/target/release/*.dll msix-staging/

      - name: MSIX Build
        id: msix-build
        if: matrix.platform == 'windows-latest'
        uses: BHznJNs/msix-build@v0.9
        with:
          app-build-path: msix-staging/
          icon-path: src/assets/image/yadikar-editor-256x256.png
          appx-manifest-path: AppxManifest.xml
          priconfig-path: priconfig.xml

      - name: Rename MSIX
        id: msix-rename
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "Yadikar-Editor_${{ steps.tauri.outputs.appVersion }}_x64.msix"
          Copy-Item "${{ steps.msix-build.outputs.msix-path }}" $dest
          "file=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload MSIX to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.tauri.outputs.appVersion }}
          draft: true
          files: ${{ steps.msix-rename.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}